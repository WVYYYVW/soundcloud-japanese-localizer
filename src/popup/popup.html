<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>SoundCloud 日本語化</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="24" height="24">
    <h1>SoundCloud 日本語化</h1>
  </header>

  <label class="row">
    <span>日本語で表示する</span>
    <input type="checkbox" id="enabled" class="switch">
  </label>

  <label class="row">
    <span>
      未翻訳の文言をコンソールに出力
      <small>訳語の追加に協力するときに使います</small>
    </span>
    <input type="checkbox" id="logUntranslated" class="switch">
  </label>

  <footer>
    <span>非公式 · v<span id="version"></span></span>
    <a href="https://github.com/WVYYYVW/soundcloud-japanese-localizer/issues" target="_blank" rel="noopener">訳の誤りを報告</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
